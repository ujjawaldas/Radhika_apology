<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Radhika 🌷</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌷</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Caveat:wght@500;700&family=Karla:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#F7E1E3;
    --paper:#FFF8F4;
    --cocoa:#43261F;
    --cocoa-soft:#7A5249;
    --berry:#A62A4D;
    --leaf:#5E7F4E;
    --butter:#F2D98B;
    --petal:#EFA3B4;
    --kraft:#D9B38C;
    --serif:"Young Serif", Georgia, "Times New Roman", serif;
    --hand:"Caveat", "Segoe Print", "Bradley Hand", cursive;
    --sans:"Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--blush);color:var(--cocoa);
    font-family:var(--sans);font-size:1.0625rem;line-height:1.6;
    overflow-x:hidden;
    background-image:radial-gradient(circle at 1px 1px, rgba(166,42,77,.09) 1px, transparent 0);
    background-size:22px 22px;
  }
  main{max-width:40rem;margin:0 auto;padding:0 1.25rem 5rem}
  section{padding:4.5rem 0 2rem}
  section[hidden]{display:none}
  h1,h2{font-family:var(--serif);font-weight:400;margin:0}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:6px}

  /* ---------- Hero ---------- */
  .hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-top:2rem}
  .hero h1{font-size:clamp(3.6rem,17vw,7.5rem);line-height:.95;color:var(--berry);letter-spacing:-.02em}
  .hero .sub{font-family:var(--hand);font-size:clamp(1.6rem,6vw,2.2rem);margin:.6rem 0 2.5rem;color:var(--cocoa)}

  /* ---------- Envelope ---------- */
  .envelope{position:relative;width:min(320px,82vw);aspect-ratio:1.55;perspective:900px}
  .env-back{position:absolute;inset:0;background:#E9B7BF;border-radius:10px}
  .env-letter{position:absolute;left:7%;right:7%;top:10%;height:80%;background:var(--paper);border-radius:6px;
    transition:transform .8s cubic-bezier(.3,.7,.3,1) .35s;
    display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:1.5rem;color:var(--berry)}
  .env-front{position:absolute;inset:0;border-radius:10px;overflow:hidden;pointer-events:none}
  .env-front::before{content:"";position:absolute;inset:0;background:#F0C4CB;
    clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
  .env-flap{position:absolute;left:0;right:0;top:0;height:60%;background:#E3A6B0;
    clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease;z-index:3}
  .seal{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:4;
    width:74px;height:74px;border:none;background:none;padding:0}
  .seal svg{width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(67,38,31,.25));transition:transform .2s}
  .seal:hover svg{transform:scale(1.07) rotate(-4deg)}
  .tap-hint{margin-top:1.4rem;font-size:.95rem;color:var(--cocoa-soft)}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
  .envelope.open .seal{opacity:0;pointer-events:none;transition:opacity .2s}
  .envelope.open .env-letter{transform:translateY(-55%)}

  /* ---------- Letter ---------- */
  .letter{background:var(--paper);padding:2.2rem 1.6rem 2rem;border-radius:4px;
    box-shadow:0 1px 0 #E9CFC9, 0 18px 40px -22px rgba(67,38,31,.45);
    transform:rotate(-.6deg);
    background-image:repeating-linear-gradient(transparent 0 2.15rem, rgba(166,42,77,.12) 2.15rem calc(2.15rem + 1px));
    background-position:0 1.6rem}
  .letter p{font-family:var(--hand);font-size:1.55rem;line-height:2.15rem;margin:0 0 2.15rem}
  .letter .greet{color:var(--berry);font-weight:700}
  .letter .sign{text-align:right;margin:0}
  @media (min-width:640px){.letter{padding:2.8rem 3rem 2.4rem}}

  .next{display:block;margin:2.2rem auto 0;background:var(--cocoa);color:var(--paper);border:none;
    padding:.85rem 1.6rem;border-radius:999px;font-weight:600}
  .next:hover{background:var(--berry)}

  /* ---------- Memories & bouquet ---------- */
  .section-title{font-size:clamp(2rem,7vw,2.7rem);line-height:1.15;text-align:center}
  .section-lede{text-align:center;max-width:32rem;margin:.8rem auto 2rem;color:var(--cocoa-soft)}
  .memory-wrap{display:grid;gap:1.5rem;align-items:start}
  @media (min-width:700px){
    main{max-width:56rem}
    .narrow{max-width:40rem;margin-left:auto;margin-right:auto}
    .memory-wrap{grid-template-columns:1fr 15rem}
  }
  .bouquet{width:100%;max-width:15rem;margin:0 auto;display:block}
  .bouquet .flower{transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .9s cubic-bezier(.3,1.6,.5,1)}
  .bouquet .flower.bloom{transform:scale(1)}
  .bouquet-count{text-align:center;font-family:var(--hand);font-size:1.4rem;margin:.3rem 0 0}

  .quiz{background:var(--paper);border-radius:18px;padding:1.6rem 1.4rem;border:2px solid #EDC9CF}
  .quiz .progress{font-size:.9rem;color:var(--cocoa-soft);margin:0 0 .4rem}
  .quiz h3{font-family:var(--serif);font-weight:400;font-size:1.45rem;line-height:1.3;margin:0 0 1.2rem}
  .options{display:grid;gap:.6rem}
  .opt{text-align:left;background:#fff;border:2px solid #EDC9CF;border-radius:12px;padding:.8rem 1rem;color:var(--cocoa);transition:border-color .15s, background .15s}
  .opt:hover{border-color:var(--petal)}
  .opt.right{border-color:var(--leaf);background:#EEF4E9}
  .opt.wrong{border-color:var(--petal);background:#FCEEF1;animation:nudge .3s}
  .feedback{min-height:3.4rem;margin:1rem 0 0;font-family:var(--hand);font-size:1.45rem;line-height:1.3;color:var(--berry)}
  @keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* ---------- Forgive ---------- */
  .ask{text-align:center;min-height:70svh;display:flex;flex-direction:column;justify-content:center}
  .ask h2{font-size:clamp(2.4rem,10vw,4.2rem);line-height:1.05;color:var(--berry)}
  .ask .choices{display:flex;gap:1rem;justify-content:center;align-items:center;margin-top:2.4rem;min-height:5rem;flex-wrap:wrap}
  .yes{background:var(--berry);color:#fff;border:none;border-radius:999px;padding:.9rem 2.2rem;font-weight:600;font-size:1.15rem;
    transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
  .no{background:transparent;color:var(--cocoa);border:2px solid var(--cocoa);border-radius:999px;padding:.75rem 1.6rem;font-weight:600;
    transition:left .25s ease, top .25s ease;touch-action:none;white-space:nowrap;z-index:20}
  .no.fleeing{position:fixed}

  .final{text-align:center}
  .final .big{font-family:var(--serif);font-size:clamp(2.4rem,10vw,4rem);color:var(--berry);line-height:1.05}
  .final p{font-family:var(--hand);font-size:1.7rem;line-height:1.35;max-width:30rem;margin:1.2rem auto 0}
  .coupon{margin:2.2rem auto 0;max-width:22rem;border:2px dashed var(--cocoa);border-radius:14px;padding:1.2rem 1.4rem;background:var(--butter);transform:rotate(1.2deg)}
  .coupon strong{font-family:var(--serif);font-weight:400;font-size:1.4rem;display:block}
  .coupon span{font-size:.95rem}

  .fall{position:fixed;top:-3rem;pointer-events:none;z-index:50;font-size:1.8rem;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(calc(100vh + 6rem)) rotate(540deg)}}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }
</style>
</head>
<body>
<main>

  <!-- 1. Hero + envelope -->
  <section class="hero" id="hero">
    <h1 id="herName">Radhika</h1>
    <p class="sub">I owe you a sorry. And a little more.</p>

    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-letter">for you ♡</div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <button class="seal" id="seal" aria-label="Open the letter">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 88 C20 66 6 48 6 31 C6 17 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 17 94 31 C94 48 80 66 50 88Z" fill="#6B3A2E"/>
          <path d="M50 78 C27 60 16 47 16 33 C16 23 24 17 32 17 C40 17 46 22 50 30 C54 22 60 17 68 17 C76 17 84 23 84 33 C84 47 73 60 50 78Z" fill="#83493A"/>
          <text x="50" y="52" text-anchor="middle" font-family="Caveat, cursive" font-size="22" fill="#F7E1E3">R</text>
        </svg>
      </button>
    </div>
    <p class="tap-hint" id="tapHint">Tap the chocolate heart to open</p>
  </section>

  <!-- 2. Letter -->
  <section id="letterSection" hidden>
    <div class="narrow">
      <article class="letter" id="letter"></article>
      <button class="next" id="toMemories">Walk down memory lane with me</button>
    </div>
  </section>

  <!-- 3. Memories quiz + bouquet -->
  <section id="memorySection" hidden>
    <h2 class="section-title">Our time together</h2>
    <p class="section-lede">Every memory you get right adds a flower to your bouquet. Take your time, I'll wait.</p>
    <div class="memory-wrap">
      <div class="quiz" aria-live="polite">
        <p class="progress" id="progress"></p>
        <h3 id="question"></h3>
        <div class="options" id="options"></div>
        <p class="feedback" id="feedback"></p>
      </div>
      <div>
        <svg class="bouquet" id="bouquet" viewBox="0 0 200 250" role="img" aria-label="A bouquet that grows with each memory">
          <g stroke="#5E7F4E" stroke-width="3" stroke-linecap="round" fill="none">
            <path d="M100 190 Q80 130 62 88"/>
            <path d="M100 190 Q120 130 140 82"/>
            <path d="M100 190 Q100 110 100 52"/>
            <path d="M100 190 Q86 150 78 128"/>
            <path d="M100 190 Q116 150 126 124"/>
          </g>
          <g fill="#5E7F4E">
            <ellipse cx="76" cy="140" rx="16" ry="6" transform="rotate(-35 76 140)"/>
            <ellipse cx="126" cy="146" rx="16" ry="6" transform="rotate(35 126 146)"/>
            <ellipse cx="92" cy="104" rx="12" ry="5" transform="rotate(-60 92 104)"/>
          </g>
          <g id="flowers"></g>
          <path d="M52 150 L148 150 L112 240 L88 240 Z" fill="#D9B38C"/>
          <path d="M52 150 L148 150 L140 168 L60 168 Z" fill="#C99E73"/>
          <path d="M84 176 Q100 190 116 176 Q104 200 100 184 Q96 200 84 176Z" fill="#A62A4D"/>
        </svg>
        <p class="bouquet-count" id="bouquetCount">0 flowers so far</p>
      </div>
    </div>
  </section>

  <!-- 4. Forgive me? -->
  <section class="ask" id="askSection" hidden>
    <h2>So… will you forgive me?</h2>
    <div class="choices">
      <button class="yes" id="yesBtn">Yes, I forgive you</button>
      <button class="no" id="noBtn">No</button>
    </div>
  </section>

  <!-- 5. Final -->
  <section class="final" id="finalSection" hidden>
    <p class="big">Thank you, my love.</p>
    <p id="finalNote"></p>
    <div class="coupon">
      <strong id="couponTitle"></strong>
      <span id="couponText"></span>
    </div>
  </section>

</main>

<script>
/* =========================================================
   ✏️  EDIT EVERYTHING IN THIS BLOCK TO MAKE IT YOURS
   ========================================================= */
const CONFIG = {
  herName: "Radhika",
  yourName: "Yours Ujjawal, always",

  // Each item is one paragraph of the letter.
  letter: [
    "Radhika,",
    "I'm sorry. I know tmhe mjhpr ab koi bharosa ni h, sb kch bhulana shyd kbhi ni ho pyga, kaash aisa kch ni hota kbhi...",
    "Meri lyf m ane k liye thankyou tmhri vjh se m bahut accha insaan bn gya hu, tmhre hone ki vjh se mjhe hmesha sbse loved persoon hone ki feeling rhti h, tmhe ye feel ni krvana will be my biggest regret",
    "Mjhe pta h shyd tmhe kch asli ni lg rha, or tmhe ab or dukh ni dkhna meri vjh se, pr m tmhre bina ni reh skta m tmhe sb khushiyaan dena chahta hu jo sb tm deserve krti ho",
    "I have loved you hmesha and will love you hmesha chahe jo bhi ho mera..."
  ],

  // Memory quiz. "answer" is the index of the correct option (0 = first).
  quiz: [
    {
      q: "Where did we go on our very first date?",
      options: ["Movies", "Science City", "CSK vs GT(Narendra Modi Stadium)"],
      answer: 1,
      memory: "Bahut nervous tha tmhe kahi psnd ni aya jgh..."
    },
    {
      q: "Which dessert you are most likely to eat first?",
      options: ["Theobrama's Chocolate Pastry", "Polar Bear's DBC", "Cheesecake & Co's Nutella Jar", "All of the above"],
      answer: 3,
      memory: "Tmhre sth hmesha khana chahta hu sb kch(Vegetarian bnkr accha lgta h)"
    },
    {
      q: "How many months pregnant is Dudu",
      options: ["5 months", "3.5 months", "Pregnant ni bs hawa bhari hui h", "Kch dino m delivery h"],
      answer: 0,
      memory: "Chotha Hathi ab Mom Hathi bn jyga"
    }
  ],

  // Messages the "No" button cycles through as it runs away
  noTexts: ["No", "Are you sure?", "Really sure?", "I made you a bouquet…", "Think of the chocolate", "Pretty please?", "Wrong button 😌"],

  finalNote: "M promise krta hu tmhe hmesha khush rkhunga, hmesha sth rhunga, hmesha tmhri protection krunga",
  couponTitle: "Date, my treat",
  couponText: "Redeemable anytime for your favourite chocolate dessert, flowers, and my full attention."
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function reveal(section){
  section.hidden = false;
  requestAnimationFrame(() => section.scrollIntoView({behavior: reduceMotion ? "auto" : "smooth", block: "start"}));
}

/* ----- Fill in names & text ----- */
$("herName").textContent = CONFIG.herName;
document.title = "For " + CONFIG.herName + " 🌷";
const letter = $("letter");
CONFIG.letter.forEach((t, i) => {
  const p = document.createElement("p");
  p.textContent = t;
  if (i === 0) p.className = "greet";
  letter.appendChild(p);
});
const sign = document.createElement("p");
sign.className = "sign";
sign.textContent = CONFIG.yourName;
letter.appendChild(sign);
$("finalNote").textContent = CONFIG.finalNote;
$("couponTitle").textContent = CONFIG.couponTitle;
$("couponText").textContent = CONFIG.couponText;

/* ----- Envelope ----- */
$("seal").addEventListener("click", () => {
  $("envelope").classList.add("open");
  $("tapHint").textContent = "";
  setTimeout(() => reveal($("letterSection")), reduceMotion ? 0 : 1100);
});
$("toMemories").addEventListener("click", () => { reveal($("memorySection")); showQuestion(); });

/* ----- Bouquet flowers ----- */
const flowerSpots = [
  {x:62, y:84, c:"#EFA3B4"}, {x:140, y:78, c:"#A62A4D"},
  {x:100, y:46, c:"#F2D98B"}, {x:78, y:124, c:"#E77F97"},
  {x:126, y:120, c:"#F7C6CF"}, {x:100, y:92, c:"#C94A6A"}
];
const flowersG = $("flowers");
const NS = "http://www.w3.org/2000/svg";
const flowerEls = CONFIG.quiz.map((_, i) => {
  const s = flowerSpots[i % flowerSpots.length];
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "flower");
  for (let k = 0; k < 6; k++) {
    const a = (k / 6) * Math.PI * 2;
    const e = document.createElementNS(NS, "ellipse");
    e.setAttribute("cx", s.x + Math.cos(a) * 11);
    e.setAttribute("cy", s.y + Math.sin(a) * 11);
    e.setAttribute("rx", 10); e.setAttribute("ry", 10);
    e.setAttribute("fill", s.c);
    g.appendChild(e);
  }
  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", s.x); c.setAttribute("cy", s.y); c.setAttribute("r", 7);
  c.setAttribute("fill", "#6B3A2E");
  g.appendChild(c);
  flowersG.appendChild(g);
  return g;
});

/* ----- Quiz ----- */
let qi = 0, bloomed = 0, locked = false;
function showQuestion(){
  const item = CONFIG.quiz[qi];
  locked = false;
  $("progress").textContent = `Memory ${qi + 1} of ${CONFIG.quiz.length}`;
  $("question").textContent = item.q;
  $("feedback").textContent = "";
  const box = $("options");
  box.innerHTML = "";
  item.options.forEach((o, idx) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o;
    b.addEventListener("click", () => choose(idx, b));
    box.appendChild(b);
  });
}
function choose(idx, btn){
  if (locked) return;
  const item = CONFIG.quiz[qi];
  if (idx === item.answer) {
    locked = true;
    btn.classList.add("right");
    $("feedback").textContent = item.memory;
    flowerEls[qi].classList.add("bloom");
    bloomed++;
    $("bouquetCount").textContent = bloomed === 1 ? "1 flower so far" : `${bloomed} flowers so far`;
    qi++;
    setTimeout(() => {
      if (qi < CONFIG.quiz.length) showQuestion();
      else {
        $("bouquetCount").textContent = "Your bouquet is ready ♡";
        $("feedback").textContent = "Every one of these is a reason I never want to lose you.";
        setTimeout(() => reveal($("askSection")), 1800);
      }
    }, 2600);
  } else {
    btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
    $("feedback").textContent = "Hmm, try again, you know this one ♡";
  }
}

/* ----- Runaway "No" button ----- */
const noBtn = $("noBtn"), yesBtn = $("yesBtn");
let dodges = 0;
function runAway(e){
  if (e) e.preventDefault();
  dodges++;
  noBtn.textContent = CONFIG.noTexts[dodges % CONFIG.noTexts.length];
  const r = noBtn.getBoundingClientRect();
  if (!noBtn.classList.contains("fleeing")) {
    noBtn.style.left = r.left + "px"; noBtn.style.top = r.top + "px";
    noBtn.classList.add("fleeing");
    void noBtn.offsetWidth;
  }
  const pad = 16;
  const maxX = window.innerWidth - r.width - pad;
  const maxY = window.innerHeight - r.height - pad;
  let x, y, tries = 0;
  const yr = yesBtn.getBoundingClientRect();
  do {
    x = pad + Math.random() * Math.max(0, maxX - pad);
    y = pad + Math.random() * Math.max(0, maxY - pad);
    tries++;
  } while (tries < 20 && Math.abs(x - yr.left) < r.width + 20 && Math.abs(y - yr.top) < r.height + 20);
  noBtn.style.left = x + "px"; noBtn.style.top = y + "px";
  yesBtn.style.transform = `scale(${Math.min(1 + dodges * 0.12, 1.8)})`;
}
noBtn.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") runAway(); });
noBtn.addEventListener("pointerdown", runAway);
noBtn.addEventListener("click", e => { if (e.detail === 0) runAway(e); else e.preventDefault(); }); // keyboard Enter/Space

/* ----- Yes! ----- */
yesBtn.addEventListener("click", () => {
  noBtn.remove();
  $("askSection").hidden = true;
  reveal($("finalSection"));
  if (reduceMotion) return;
  const bits = ["🌸","🍫","🌷","💗","🧁","🌹","🍓"];
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("span");
    s.className = "fall";
    s.textContent = bits[i % bits.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.fontSize = (1.2 + Math.random() * 1.4) + "rem";
    s.style.animationDuration = (3 + Math.random() * 3) + "s";
    s.style.animationDelay = (Math.random() * 2.5) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 9000);
  }
});
</script>
</body>
</html>
